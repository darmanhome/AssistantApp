name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'assistantapp'
      storepass:
        description: 'Keystore password (min 6 chars)'
        required: true
      keypass:
        description: 'Key password (min 6 chars, can be same as storepass)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.storepass }}" \
            -keypass "${{ inputs.keypass }}" \
            -dname "CN=AssistantApp, OU=Dev, O=darmanhome, L=NA, ST=NA, C=US"
          base64 -w0 release.keystore > release_keystore_base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release_keystore_base64.txt
          retention-days: 1
